# SPDX-License-Identifier: CC-BY-4.0
#
# Pinned scripture datasets for `flock-scripture-import` (spec:
# docs/architecture/herald-scripture-connections.md, section 4; runbook:
# runbooks/scripture-import.md).
#
# The datasets themselves are NEVER committed. The importer downloads each one,
# checks its sha256 against this file, and refuses to parse anything that does
# not match. Changing a pin is a reviewed PR: re-measure with
# `shasum -a 256`, update `sha256` and `bytes`, and say why in the PR.
#
# `url` is an immutable address, and `Manifest::parse` refuses any other: a
# Wayback Machine `id_` snapshot (the archived bytes, unchanged), or a
# raw.githubusercontent.com path at a full 40-hex commit sha. ebible.org
# rebuilds its zips in place (both USFM zips were regenerated on 2026-10-18),
# so a hash pinned to the live address would start refusing on the
# publisher's next rebuild. `license` is public domain or CC BY 4.0 and
# nothing else (the owner's rule). `mirrors` are tried in order
# when `url` fails; a mirror passes only while its bytes still hash to `sha256`,
# so a rebuilt upstream fails closed instead of loading unreviewed text.
#
# Treasury of Scripture Knowledge: NOT pinned. No clean, standalone,
# public-domain machine-readable TSK source was confirmed (the copies in
# circulation are re-keyed by third parties under unclear terms, or are merged
# into OpenBible's own dataset). `herald_scripture_xrefs` rows with
# source = 'tsk' stay empty until one is.

